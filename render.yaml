services:
  - type: web
    name: wallet-transfer-app
    runtime: docker
    repo: https://github.com/shanukrsingh/wallet-app.git
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString
      - key: LOG_LEVEL
        value: info

databases:
  - name: wallet-db
    plan: free
    databaseName: wallet
    user: wallet